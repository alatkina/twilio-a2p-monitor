name: Twilio Monitor

on:
  schedule:
    - cron: '0 9 1 * *'

  workflow_dispatch:
    inputs:
      account:
        description: 'Subaccount name (optional)'
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests gspread google-auth openpyxl

      - name: Run Twilio check
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          INPUT_ACCOUNT: ${{ github.event.inputs.account }}
        run: python check.py

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: twilio-result
          path: result.md
