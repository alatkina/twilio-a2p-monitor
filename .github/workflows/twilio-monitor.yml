name: Twilio Monitor

on:
  schedule:
    - cron: '0 9 1 * *'  # 1-го числа каждого месяца в 9:00 UTC
  workflow_dispatch:      # Ручной запуск через GitHub UI
    inputs:
      note:
        description: 'Комментарий к запуску (необязательно)'
        required: false
        default: 'Manual run'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests gspread google-auth openpyxl

      - name: Run Twilio check
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python check.py
